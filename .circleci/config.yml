version: 2.1

jobs:
  test_Explicit_Wait:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run: python Files/explicit_wait.py

  test_Fluent_wait:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run: python Files/fluent_wait.py
      
workflows:
  version: 2
  sequence_of_execution:
    jobs:
      - test_Explicit_Wait
      - test_Fluent_wait